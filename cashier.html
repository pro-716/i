<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RESPAWN | مركز القيادة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { 
                        darkBg: '#0B0B0F', 
                        panelBg: 'rgba(25, 25, 35, 0.7)',
                        primaryPurple: '#6D28D9',
                        neonViolet: '#A855F7',
                        accentCyan: '#22D3EE'
                    },
                    fontFamily: { cairo: ['Cairo', 'sans-serif'], orbitron: ['Orbitron', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0B0B0F; color: #fff; overflow: hidden; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .sidebar-link.active { background: linear-gradient(90deg, #6D28D9, #A855F7); color: white; box-shadow: 0 4px 15px rgba(109, 40, 217, 0.4); }
        .table-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .table-card:hover { transform: translateY(-5px); border-color: #A855F7; box-shadow: 0 10px 20px rgba(168, 85, 247, 0.2); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .custom-gradient { background: linear-gradient(135deg, #6D28D9 0%, #A855F7 100%); }
    </style>
</head>
<body class="h-screen flex overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-72 h-full glass border-l border-white/10 flex flex-col p-6 z-50">
        <div class="text-center mb-10">
            <h1 class="text-3xl font-black tracking-tighter font-orbitron text-white">RESPAWN<span class="text-neonViolet">.</span></h1>
            <p class="text-xs text-gray-400 font-orbitron uppercase tracking-widest">Cashier Control</p>
        </div>
        
        <nav class="flex flex-col gap-3 flex-1">
            <button onclick="switchView('dashboard')" id="btn-dashboard" class="sidebar-link active flex items-center gap-4 p-4 rounded-2xl transition-all font-bold text-gray-400 hover:text-white">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                لوحة التحكم
            </button>
            <button onclick="switchView('tables')" id="btn-tables" class="sidebar-link flex items-center gap-4 p-4 rounded-2xl transition-all font-bold text-gray-400 hover:text-white">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                إدارة الطاولات
            </button>
            <button onclick="switchView('menu')" id="btn-menu" class="sidebar-link flex items-center gap-4 p-4 rounded-2xl transition-all font-bold text-gray-400 hover:text-white">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
                إدارة المنيو
            </button>
            <button onclick="switchView('invoices')" id="btn-invoices" class="sidebar-link flex items-center gap-4 p-4 rounded-2xl transition-all font-bold text-gray-400 hover:text-white">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                الفواتير والتقارير
            </button>
        </nav>

        <div class="mt-auto pt-6 border-t border-white/10">
            <button onclick="resetSystem()" class="w-full p-4 rounded-2xl bg-red-500/10 text-red-500 hover:bg-red-500 hover:text-white transition-all font-bold flex items-center justify-center gap-2">
                تصفير النظام ⚠️
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 h-full overflow-y-auto no-scrollbar p-8 relative">
        
        <!-- Top Stats Bar -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10 animate__animated animate__fadeInDown">
            <div class="glass p-6 rounded-3xl flex items-center gap-6">
                <div class="w-14 h-14 rounded-2xl custom-gradient flex items-center justify-center text-2xl">💰</div>
                <div>
                    <p class="text-gray-400 text-xs font-bold uppercase">إيراد اليوم</p>
                    <h3 id="day-rev" class="text-2xl font-black font-orbitron">0 IQD</h3>
                </div>
            </div>
            <div class="glass p-6 rounded-3xl flex items-center gap-6">
                <div class="w-14 h-14 rounded-2xl bg-accentCyan flex items-center justify-center text-2xl">📅</div>
                <div>
                    <p class="text-gray-400 text-xs font-bold uppercase">إيراد الشهر</p>
                    <h3 id="month-rev" class="text-2xl font-black font-orbitron">0 IQD</h3>
                </div>
            </div>
            <div class="glass p-6 rounded-3xl flex items-center gap-6">
                <div class="w-14 h-14 rounded-2xl bg-neonViolet flex items-center justify-center text-2xl">🔥</div>
                <div>
                    <p class="text-gray-400 text-xs font-bold uppercase">طاولات نشطة</p>
                    <h3 id="active-tables-count" class="text-2xl font-black font-orbitron">0</h3>
                </div>
            </div>
        </div>

        <!-- View: Dashboard -->
        <div id="view-dashboard" class="view animate__animated animate__fadeIn">
            <h2 class="text-3xl font-black mb-6">نظرة عامة على <span class="text-neonViolet">النظام</span></h2>
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <div class="glass p-8 rounded-[3rem]">
                    <h3 class="text-xl font-bold mb-6 flex items-center gap-2">🚀 المنتجات الأكثر طلباً</h3>
                    <div id="top-products" class="space-y-4"></div>
                </div>
                <div class="glass p-8 rounded-[3rem]">
                    <h3 class="text-xl font-bold mb-6 flex items-center gap-2">🕒 تنبيهات الوقت</h3>
                    <div id="time-alerts" class="space-y-4"></div>
                </div>
            </div>
        </div>

        <!-- View: Tables -->
        <div id="view-tables" class="view hidden animate__animated animate__fadeIn">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-3xl font-black">إدارة <span class="text-neonViolet">الطاولات</span></h2>
                <button onclick="openAddTableModal()" class="px-6 py-3 rounded-2xl custom-gradient font-bold hover:scale-105 transition-all shadow-lg shadow-purple-500/30">إضافة طاولة +</button>
            </div>
            <div id="tables-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
        </div>

        <!-- View: Menu -->
        <div id="view-menu" class="view hidden animate__animated animate__fadeIn">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-3xl font-black">إدارة <span class="text-neonViolet">المنيو</span></h2>
                <button onclick="openAddCategoryModal()" class="px-6 py-3 rounded-2xl custom-gradient font-bold hover:scale-105 transition-all">إضافة قسم +</button>
            </div>
            <div id="categories-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
        </div>

        <!-- View: Invoices -->
        <div id="view-invoices" class="view hidden animate__animated animate__fadeIn">
            <h2 class="text-3xl font-black mb-8">سجل <span class="text-neonViolet">الفواتير</span></h2>
            <div class="glass rounded-[3rem] overflow-hidden">
                <table class="w-full text-right">
                    <thead class="bg-white/5 text-gray-400 uppercase text-xs font-bold">
                        <tr>
                            <th class="p-6">رقم الفاتورة</th>
                            <th class="p-6">الطاولة</th>
                            <th class="p-6">المجموع</th>
                            <th class="p-6">التاريخ</th>
                            <th class="p-6">الإجراء</th>
                        </tr>
                    </thead>
                    <tbody id="invoices-list" class="divide-y divide-white/5"></tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- Global Modal -->
    <div id="modal-overlay" class="fixed inset-0 bg-black/80 backdrop-blur-md z-[100] hidden flex items-center justify-center p-4">
        <div id="modal-content" class="glass w-full max-w-2xl p-10 rounded-[3rem] animate__animated animate__zoomIn relative">
            <button onclick="closeModal()" class="absolute top-6 left-6 text-gray-400 hover:text-white text-2xl">✕</button>
            <div id="modal-body"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, query, where, onSnapshot, writeBatch, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAFQx3BndP3piYkONM0KSBcb5vo8xx3a5Q",
            authDomain: "respawn-7654a.firebaseapp.com",
            projectId: "respawn-7654a",
            storageBucket: "respawn-7654a.firebasestorage.app",
            messagingSenderId: "503079760523",
            appId: "1:503079760523:web:002bb6364abd211f5a9a8e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allProducts = [];
        let allCategories = [];

        window.switchView = (view) => {
            document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
            document.getElementById(`view-${view}`).classList.remove('hidden');
            document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
            document.getElementById(`btn-${view}`).classList.add('active');
        };

        // --- Tables Management ---
        onSnapshot(query(collection(db, "tables"), where("status", "==", "open")), (snap) => {
            const grid = document.getElementById('tables-grid');
            grid.innerHTML = '';
            document.getElementById('active-tables-count').innerText = snap.size;
            
            snap.forEach(docSnap => {
                const table = docSnap.data();
                const id = docSnap.id;
                grid.innerHTML += `
                    <div class="table-card glass p-6 rounded-3xl border-r-4 border-neonViolet" onclick="manageTable('${id}')">
                        <div class="flex justify-between items-start mb-4">
                            <h4 class="text-xl font-black font-orbitron">${table.name}</h4>
                            <span class="text-[10px] px-2 py-1 rounded-lg bg-neonViolet text-white font-bold">مشغول</span>
                        </div>
                        <div class="flex justify-between items-end">
                            <div class="text-xs text-gray-400 font-bold">${table.items ? table.items.length : 0} أصناف</div>
                            <div class="text-2xl font-black text-accentCyan font-orbitron">${table.currentTotal || 0} IQD</div>
                        </div>
                    </div>
                `;
            });
        });

        window.manageTable = async (id) => {
            const snap = await getDocs(doc(db, "tables", id));
            // Simplification for demo, usually you'd get the doc directly
            const tableRef = doc(db, "tables", id);
            const tableSnap = await getDocs(query(collection(db, "tables"), where("__name__", "==", id)));
            const table = tableSnap.docs[0].data();
            
            const body = document.getElementById('modal-body');
            body.innerHTML = `
                <h2 class="text-3xl font-black mb-6 text-center">إدارة ${table.name}</h2>
                <div class="flex gap-4 mb-8">
                    <button onclick="openProductPicker('${id}')" class="flex-1 p-4 rounded-2xl custom-gradient font-bold">إضافة منتج +</button>
                    <button onclick="transferTable('${id}')" class="flex-1 p-4 rounded-2xl glass font-bold hover:bg-white/10 transition-all">نقل الحساب ⇄</button>
                </div>
                <div class="space-y-4 max-h-60 overflow-y-auto no-scrollbar mb-8" id="table-items-list">
                    ${table.items ? table.items.map((item, idx) => `
                        <div class="flex justify-between items-center p-4 glass rounded-2xl">
                            <div><span class="font-bold">${item.name}</span> <span class="text-xs text-gray-400 mr-2">${item.price} IQD</span></div>
                            <div class="flex gap-2">
                                <button onclick="updateItemQty('${id}', ${idx}, 1)" class="w-8 h-8 rounded-lg bg-white/10 hover:bg-white/20">+</button>
                                <button onclick="updateItemQty('${id}', ${idx}, -1)" class="w-8 h-8 rounded-lg bg-white/10 hover:bg-white/20">-</button>
                            </div>
                        </div>
                    `).join('') : '<p class="text-center text-gray-500">لا توجد طلبات حالياً</p>'}
                </div>
                <div class="flex justify-between items-center p-6 glass rounded-3xl mb-8">
                    <span class="font-bold text-gray-400">الإجمالي المستحق:</span>
                    <span class="text-3xl font-black text-accentCyan font-orbitron">${table.currentTotal || 0} IQD</span>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <button onclick="closeTable('${id}')" class="p-4 rounded-2xl bg-neonViolet font-bold hover:scale-105 transition-all">إغلاق ودفع ✅</button>
                    <button onclick="deleteTable('${id}')" class="p-4 rounded-2xl bg-red-500/20 text-red-500 font-bold hover:bg-red-500 hover:text-white transition-all">حذف الطاولة 🗑️</button>
                </div>
            `;
            document.getElementById('modal-overlay').classList.remove('hidden');
        };

        // --- Menu Management ---
        async function loadMenu() {
            const catSnap = await getDocs(collection(db, "categories"));
            const prodSnap = await getDocs(collection(db, "products"));
            allCategories = catSnap.docs.map(d => ({id: d.id, ...d.data()}));
            allProducts = prodSnap.docs.map(d => ({id: d.id, ...d.data()}));
            renderMenu();
        }

        function renderMenu() {
            const container = document.getElementById('categories-container');
            container.innerHTML = '';
            allCategories.forEach(cat => {
                const catProds = allProducts.filter(p => p.categoryId === cat.id);
                container.innerHTML += `
                    <div class="glass p-6 rounded-[2.5rem] border-t-4 border-neonViolet">
                        <div class="flex justify-between items-center mb-6">
                            <h3 class="text-xl font-black">${cat.name}</h3>
                            <button onclick="openAddProductModal('${cat.id}')" class="text-xs bg-white/10 px-3 py-1 rounded-lg hover:bg-neonViolet transition-all">+ صنف</button>
                        </div>
                        <div class="space-y-3">
                            ${catProds.map(p => `
                                <div class="flex justify-between items-center p-3 bg-white/5 rounded-xl text-sm">
                                    <span>${p.name}</span>
                                    <div class="flex items-center gap-3">
                                        <span class="font-orbitron text-accentCyan">${p.price} IQD</span>
                                        <button onclick="deleteProduct('${p.id}')" class="text-red-500">✕</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                        <button onclick="deleteCategory('${cat.id}')" class="w-full mt-6 p-2 text-xs text-red-500 hover:bg-red-500/10 rounded-xl transition-all">حذف القسم 🗑️</button>
                    </div>
                `;
            });
        }

        window.openAddCategoryModal = () => {
            const body = document.getElementById('modal-body');
            body.innerHTML = `
                <h2 class="text-3xl font-black mb-8 text-center">إضافة قسم جديد</h2>
                <input id="new-cat-name" type="text" placeholder="اسم القسم" class="w-full p-4 rounded-2xl bg-black/40 border border-white/10 mb-6 outline-none focus:border-neonViolet transition-all">
                <button onclick="saveCategory()" class="w-full p-4 rounded-2xl custom-gradient font-bold text-xl">إنشاء القسم ✅</button>
            `;
            document.getElementById('modal-overlay').classList.remove('hidden');
        };

        window.saveCategory = async () => {
            const name = document.getElementById('new-cat-name').value;
            if(!name) return alert("أدخل اسم القسم!");
            await addDoc(collection(db, "categories"), { name });
            await loadMenu();
            closeModal();
        };

        window.openAddProductModal = (catId) => {
            const body = document.getElementById('modal-body');
            body.innerHTML = `
                <h2 class="text-3xl font-black mb-8 text-center">إضافة منتج</h2>
                <input id="prod-name" type="text" placeholder="اسم المنتج" class="w-full p-4 rounded-2xl bg-black/40 border border-white/10 mb-4 outline-none focus:border-neonViolet transition-all">
                <input id="prod-price" type="number" placeholder="السعر بالدينار" class="w-full p-4 rounded-2xl bg-black/40 border border-white/10 mb-6 outline-none focus:border-neonViolet transition-all">
                <button onclick="saveProduct('${catId}')" class="w-full p-4 rounded-2xl custom-gradient font-bold text-xl">إضافة للمنيو ✅</button>
            `;
            document.getElementById('modal-overlay').classList.remove('hidden');
        };

        window.saveProduct = async (catId) => {
            const name = document.getElementById('prod-name').value;
            const price = parseInt(document.getElementById('prod-price').value);
            if(!name || !price) return alert("أكمل البيانات!");
            await addDoc(collection(db, "products"), { name, price, categoryId: catId });
            await loadMenu();
            closeModal();
        };

        window.deleteProduct = async (id) => {
            if(confirm("حذف المنتج؟")) { await deleteDoc(doc(db, "products", id)); loadMenu(); }
        };

        window.deleteCategory = async (id) => {
            if(confirm("حذف القسم وكل منتجاته؟")) {
                await deleteDoc(doc(db, "categories", id));
                const prods = await getDocs(collection(db, "products"));
                prods.forEach(p => { if(p.data().categoryId === id) deleteDoc(doc(db, "products", p.id)); });
                loadMenu();
            }
        };

        // --- Table Logic ---
        window.openProductPicker = (tableId) => {
            const body = document.getElementById('modal-body');
            body.innerHTML = `
                <h2 class="text-3xl font-black mb-8 text-center">إضافة صنف للطاولة</h2>
                <div class="grid grid-cols-1 gap-4 max-h-96 overflow-y-auto no-scrollbar">
                    ${allProducts.map(p => `
                        <div onclick="addToTable('${tableId}', '${p.id}')" class="flex justify-between items-center p-4 glass rounded-2xl cursor-pointer hover:bg-neonViolet transition-all">
                            <span class="font-bold">${p.name}</span>
                            <span class="font-orbitron">${p.price} IQD</span>
                        </div>
                    `).join('')}
                </div>
            `;
            document.getElementById('modal-overlay').classList.remove('hidden');
        };

        window.addToTable = async (tableId, prodId) => {
            const prod = allProducts.find(p => p.id === prodId);
            const tableRef = doc(db, "tables", tableId);
            const tableSnap = await getDocs(query(collection(db, "tables"), where("__name__", "==", tableId)));
            const tableData = tableSnap.docs[0].data();
            
            const items = tableData.items || [];
            items.push({ name: prod.name, price: prod.price, qty: 1 });
            await updateDoc(tableRef, { items, currentTotal: (tableData.currentTotal || 0) + prod.price });
            manageTable(tableId);
        };

        window.closeTable = async (id) => {
            const tableSnap = await getDocs(query(collection(db, "tables"), where("__name__", "==", id)));
            const table = tableSnap.docs[0].data();
            
            await addDoc(collection(db, "invoices"), {
                tableName: table.name, total: table.currentTotal, items: table.items, timestamp: serverTimestamp()
            });

            await updateDoc(doc(db, "tables", id), { status: 'closed', currentTotal: 0, items: [] });
            closeModal();
        };

        window.deleteTable = async (id) => {
            if(confirm("حذف الطاولة؟")) { await deleteDoc(doc(db, "tables", id)); closeModal(); }
        };

        window.resetSystem = async () => {
            if(confirm("تصفير جميع الطاولات؟")) {
                const snap = await getDocs(collection(db, "tables"));
                const batch = writeBatch(db);
                snap.forEach(d => batch.update(d.ref, { status: 'closed', currentTotal: 0, items: [] }));
                await batch.commit();
                alert("تم التصفير ✅");
            }
        };

        window.closeModal = () => document.getElementById('modal-overlay').classList.add('hidden');

        window.onload = async () => {
            loadMenu();
            onSnapshot(collection(db, "invoices"), (snap) => {
                const list = document.getElementById('invoices-list');
                list.innerHTML = '';
                snap.forEach(d => {
                    const inv = d.data();
                    list.innerHTML += `<tr class="hover:bg-white/5 transition-all">
                        <td class="p-6 font-orbitron">${d.id.substring(0,5)}</td>
                        <td class="p-6 font-bold">${inv.tableName}</td>
                        <td class="p-6 text-accentCyan font-black">${inv.total} IQD</td>
                        <td class="p-6 text-xs text-gray-400">${inv.timestamp?.toDate().toLocaleString('ar-IQ')}</td>
                        <td class="p-6"><button class="text-neonViolet hover:underline font-bold">تفاصيل</button></td>
                    </tr>`;
                });
            });
        };
    </script>
</body>
</html>
